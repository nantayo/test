name: Get Podman's Update Information

on:
  workflow_dispatch:
    inputs:
      patch:
        description: 'Refresh patch files'
        required: true
        default: 'true'
        type: choice
        options:
          - true
          - false
      hash:
        description: 'Refresh package hash'
        required: true
        default: 'true'
        type: choice
        options:
          - true
          - false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update > /dev/null
          sudo -E apt-get -qq install -y $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/openwrt) > /dev/null
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

      - name: Update & Install feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          bash $GITHUB_WORKSPACE/x86/64/diy/diy.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        run: |
          rm -rf openwrt/files openwrt/.config
          mv x86/64/2-7505/files x86/64/2-7505/.config openwrt/
          chmod -R 755 openwrt

      - name: Download package
        working-directory: ./openwrt
        run: |
          make defconfig
          make download -j$(( $(nproc) * 2 ))

      - name: Refresh patch file
        if: ${{ github.event.inputs.patch == 'true' }}
        working-directory: ./openwrt
        run: |
          make tools/install -j$(( $(nproc) + 1 ))
          make toolchain/install -j$(( $(nproc) + 1 ))
          make package/podman/refresh
          make package/aardvark-dns/refresh
          mv feeds/packages/utils/podman/patches/*.patch feeds/packages/net/aardvark-dns/patches/*.patch ./

      - name: Upload patch file to release
        if: ${{ github.event.inputs.patch == 'true' }}
        run: |
          tag="Podman_patch_${{ env.FILE_DATE }}"
          gh release create $tag --repo ${{ github.repository }} --title "$tag" --notes "" 2> /dev/null || true
          gh release upload $tag openwrt/*.patch --repo ${{ github.repository }} --clobber

      - name: Delete old releases
        if: ${{ github.event.inputs.patch == 'true' }}
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[] | .tagName | select(test("patch"))' | tail -n +2 | while read -r tag; do gh release delete "$tag" --repo ${{ github.repository }} --cleanup-tag --yes; done

      - name: Get libocispec hash
        if: ${{ github.event.inputs.hash == 'true' }}
        working-directory: ./openwrt
        run: |
          sha256sum dl/libocispec-872b8b0b7ccb1a121601ede0dcac8c6b8a1008a6.tar.xz

      - name: Upload .tar.xz file to release
        if: ${{ github.event.inputs.hash == 'true' }}
        run: |
          tag="Podman_dep_${{ env.FILE_DATE }}"
          gh release create $tag --repo ${{ github.repository }} --title "$tag" --notes "" 2> /dev/null || true
          gh release upload $tag openwrt/dl/libocispec-*.tar.xz --repo ${{ github.repository }} --clobber

      - name: Delete old releases
        if: ${{ github.event.inputs.hash == 'true' }}
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[] | .tagName | select(test("dep"))' | tail -n +2 | while read -r tag; do gh release delete "$tag" --repo ${{ github.repository }} --cleanup-tag --yes; done
